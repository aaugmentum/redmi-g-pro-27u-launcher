plugins {
    id 'com.android.application'
}

// Speech recognition for the remote's mic button (VoiceInput, docs/specs/voice-input.md): sherpa-onnx, which is
// not on Maven Central. Downloaded once from its GitHub release into libs/ (not in git) and checked.
def sherpaAar = file('libs/sherpa-onnx-static-link-onnxruntime-1.13.8.aar')
if (!sherpaAar.exists()) {
    def url = 'https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-static-link-onnxruntime-1.13.8.aar'
    def part = new File(sherpaAar.path + '.part')
    sherpaAar.parentFile.mkdirs()
    logger.lifecycle("Downloading $url")
    new URL(url).withInputStream { input -> part.withOutputStream { it << input } }
    def sha = java.security.MessageDigest.getInstance('SHA-256').digest(part.bytes).encodeHex().toString()
    if (sha != 'b22c3fc1b6a45666d28892bb2f7694beeb77a8362d7ebd77c1a5431ec9435471') {
        part.delete()
        throw new GradleException("sherpa-onnx AAR has the wrong SHA-256: $sha")
    }
    part.renameTo(sherpaAar)
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 26
        // 29, not upstream's 34: Android picks an app's SELinux domain by its targetSdk, and Xiaomi's firmware lets
        // only the older domains reach the MediaTek TV service behind the panel backlight (Backlight.java). With
        // 34 the first backlight read waits 5 s and fails. This fork is for the Redmi G Pro 27U, not Google TV
        // (which wants 34 to install it).
        targetSdk 29
        versionCode 3
        versionName '2.2'
        // The monitor runs 64-bit apps; sherpa-onnx's other ABIs would add about 50 MB.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    lint {
        // Sideloaded over ADB, never published to Google Play, so Play's minimum targetSdk does not apply;
        // without this, lintVitalRelease fails assembleRelease.
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation files(sherpaAar)
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'   // sherpa-onnx's API is Kotlin
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
